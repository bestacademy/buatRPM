      const [currentTab, setCurrentTab] = useState('dashboard');
      const [toast, setToast] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);
      const [formData, setFormData] = useState({
        ...PDF_SAMPLE_DATA,
        editorContent: generatePDFMatchedRpmHtml(PDF_SAMPLE_DATA),
        generatedResult: generatePDFMatchedRpmHtml(PDF_SAMPLE_DATA)
      });
      const [savedRpmList, setSavedRpmList] = useState([
        {
          id: 'RPM-2026-001',
          mataPelajaran: 'Perhotelan',
          kelas: 'XII',
          fase: 'F',
          materi: 'Sejarah Hotel & Evolusi Pelayanan',
          tanggal: '2026-07-20',
          status: 'Selesai (Siap Cetak / Word)',
          isi: generatePDFMatchedRpmHtml(PDF_SAMPLE_DATA)
        }
      ]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const handleDownloadWord = async () => {
        showToast('Menyiapkan dokumen Word dengan gambar tertanam...');
        try {
          const principalBase64 = await urlToBase64(PRINCIPAL_STAMP_SIGNATURE_URL);
          const teacherBase64 = await urlToBase64(TEACHER_SIGNATURE_URL);

          let htmlContent = formData.editorContent || generatePDFMatchedRpmHtml(formData);
          htmlContent = htmlContent.replace(PRINCIPAL_STAMP_SIGNATURE_URL, principalBase64);
          htmlContent = htmlContent.replace(TEACHER_SIGNATURE_URL, teacherBase64);

          const blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `RPM_${formData.mataPelajaran.replace(/\s+/g, '_')}_${formData.kelas}.doc`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('Dokumen Word Berhasil Diunduh!');
        } catch (err) {
          showToast('Gagal mengunduh dokumen Word', 'error');
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex font-sans antialiased">
          {toast && (
            <div className="fixed top-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700">
              {toast.type === 'error' ? <AlertCircle className="w-5 h-5 text-red-400" /> : <CheckCircle2 className="w-5 h-5 text-emerald-400" />}
              <span className="text-sm font-medium">{toast.message}</span>
            </div>
          )}

          {/* Sidebar */}
          <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex border-r border-slate-800">
            <div className="p-6 space-y-6">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-lg">
                  <Sparkles className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="font-bold text-white text-base">RPM Generator</h1>
                  <p className="text-xs text-slate-400">Kurikulum Merdeka</p>
                </div>
              </div>
              <nav className="space-y-1">
                <button onClick={() => setCurrentTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${currentTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}`}>
                  <LayoutTemplate className="w-5 h-5" /> Dashboard
                </button>
                <button onClick={() => setCurrentTab('wizard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${currentTab === 'wizard' ? 'bg-indigo-600 text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}`}>
                  <Plus className="w-5 h-5" /> Buat RPM Baru
                </button>
                <button onClick={() => setCurrentTab('preview')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${currentTab === 'preview' ? 'bg-indigo-600 text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}`}>
                  <FileText className="w-5 h-5" /> Pratinjau RPM
                </button>
                <button onClick={() => setCurrentTab('history')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${currentTab === 'history' ? 'bg-indigo-600 text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}`}>
                  <History className="w-5 h-5" /> Riwayat RPM
                </button>
              </nav>
            </div>
            <div className="p-6 border-t border-slate-800 text-xs text-slate-500">
              SMK Negeri 1 Bebandem © 2026
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
            <header className="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between sticky top-0 z-20">
              <div className="flex items-center gap-3">
                <h2 className="text-xl font-bold text-slate-800 capitalize">
                  {currentTab === 'dashboard' && 'Dashboard Utama'}
                  {currentTab === 'wizard' && 'Wizard Pembuatan RPM'}
                  {currentTab === 'preview' && 'Pratinjau & Unduh RPM'}
                  {currentTab === 'history' && 'Riwayat Dokumen Tersimpan'}
                </h2>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={handleDownloadWord} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md transition">
                  <Download className="w-4 h-4" /> Unduh Word (.doc)
                </button>
              </div>
            </header>

            <div className="p-8 max-w-6xl w-full mx-auto space-y-6">
              {currentTab === 'dashboard' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-r from-indigo-900 to-blue-900 text-white p-8 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-center gap-6">
                    <div className="space-y-2">
                      <span className="bg-indigo-500/30 text-indigo-200 text-xs px-3 py-1 rounded-full font-semibold">Kurikulum Merdeka 2026</span>
                      <h3 className="text-2xl font-bold">Selamat Datang, {formData.namaGuru}</h3>
                      <p className="text-slate-300 text-sm max-w-xl">Aplikasi penyusunan Rencana Pembelajaran Mendalam (RPM) profesional dengan pendekatan Deep Learning & integrasi AI.</p>
                    </div>
                    <button onClick={() => setCurrentTab('wizard')} className="bg-white text-indigo-900 hover:bg-indigo-50 px-6 py-3 rounded-xl font-bold text-sm shadow-lg transition flex items-center gap-2">
                      <Plus className="w-5 h-5" /> Buat RPM Sekarang
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                      <div className="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold">
                        <FileText className="w-6 h-6" />
                      </div>
                      <div>
                        <p className="text-xs text-slate-500">Total RPM Tersimpan</p>
                        <h4 className="text-xl font-bold text-slate-800">{savedRpmList.length} Dokumen</h4>
                      </div>
                    </div>
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                      <div className="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold">
                        <School className="w-6 h-6" />
                      </div>
                      <div>
                        <p className="text-xs text-slate-500">Satuan Pendidikan</p>
                        <h4 className="text-md font-bold text-slate-800">{formData.satuanPendidikan}</h4>
                      </div>
                    </div>
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                      <div className="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center font-bold">
                        <BookOpen className="w-6 h-6" />
                      </div>
                      <div>
                        <p className="text-xs text-slate-500">Mata Pelajaran Aktif</p>
                        <h4 className="text-md font-bold text-slate-800">{formData.mataPelajaran}</h4>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {currentTab === 'wizard' && (
                <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                  <div className="flex justify-between items-center border-b border-slate-100 pb-4">
                    <div>
                      <h3 className="text-lg font-bold text-slate-800">Formulir Penyusunan RPM</h3>
                      <p className="text-xs text-slate-500">Sesuaikan data identitas dan materi pembelajaran.</p>
                    </div>
                    <button onClick={() => { setFormData(prev => ({ ...prev, ...PDF_SAMPLE_DATA })); showToast('Data sampel berhasil dimuat!'); }} className="text-xs bg-indigo-50 text-indigo-600 font-semibold px-4 py-2 rounded-xl hover:bg-indigo-100 transition">
                      Muat Contoh Data Lengkap
                    </button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Mata Pelajaran</label>
                      <input type="text" value={formData.mataPelajaran} onChange={e => setFormData({...formData, mataPelajaran: e.target.value})} className="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Kelas / Fase</label>
                      <input type="text" value={formData.kelas} onChange={e => setFormData({...formData, kelas: e.target.value})} className="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                    </div>
                  </div>
                  <div className="pt-4 flex justify-end">
                    <button onClick={() => { setCurrentTab('preview'); showToast('RPM Berhasil Diperbarui!'); }} className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl text-sm font-semibold shadow-lg transition">
                      Simpan & Lihat Pratinjau
                    </button>
                  </div>
                </div>
              )}

              {currentTab === 'preview' && (
                <div className="space-y-4">
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                    <div>
                      <h3 className="font-bold text-slate-800">Pratinjau Dokumen</h3>
                      <p className="text-xs text-slate-500">Tampilan dokumen sesuai format resmi siap cetak.</p>
                    </div>
                    <button onClick={handleDownloadWord} className="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow transition">
                      <Download className="w-4 h-4" /> Download Word (.doc)
                    </button>
                  </div>
                  <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
                    <div dangerouslySetInnerHTML={{ __html: formData.generatedResult }} />
                  </div>
                </div>
              )}

              {currentTab === 'history' && (
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                  <h3 className="font-bold text-slate-800 text-lg">Daftar Riwayat RPM</h3>
                  <div className="divide-y divide-slate-100">
                    {savedRpmList.map(item => (
                      <div key={item.id} className="py-4 flex items-center justify-between">
                        <div>
                          <h4 className="font-bold text-slate-800 text-sm">{item.mataPelajaran} - Kelas {item.kelas}</h4>
                          <p className="text-xs text-slate-500">Materi: {item.materi} | Tanggal: {item.tanggal}</p>
                        </div>
                        <button onClick={() => { setFormData(prev => ({...prev, generatedResult: item.isi, editorContent: item.isi})); setCurrentTab('preview'); }} className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-medium transition">
                          Buka Pratinjau
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
